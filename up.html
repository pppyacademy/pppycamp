<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- 1. Viewport Meta Tag: หัวใจสำคัญของการแสดงผลบนมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>File Uploading System</title>
    <style>
        /* ล้างค่าเริ่มต้นของ Browser */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกัน Scrollbar ซ้อนกัน 2 ชั้น */
        }

        iframe {
            display: block; /* ป้องกันช่องว่างด้านล่าง */
            width: 100%;
            
            /* ความสูง: ใช้ 100dvh สำหรับมือถือรุ่นใหม่เพื่อไม่ให้โดน Address bar บัง */
            height: 100vh; 
            height: 100dvh; 
            
            border: none;
        }
    </style>
</head>
<body>
    <!-- ถอด src ออกจาก iframe แล้วใช้ JavaScript กำหนดแทน เพื่อไม่ให้โหลดเบิ้ล 2 รอบ -->
    <iframe 
        id="appFrame"
        allow="camera; microphone; forms; geolocation; autoplay"
    ></iframe>

    <script>
        // URL หลักของ Google Apps Script
        const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx57binzcNArAuAG0OTsz9HVvoqLhJb1kFbJy0u9sE-ENcdc_pTQViZhbDJVDnpbd26/exec";
        
        // ดึง parameter ทั้งหมดที่ส่งมายัง GitHub (เช่น ?to=finance หรือ ?to=hr)
        const currentParams = window.location.search;
        
        // ส่งต่อ parameter ไปยัง iframe ของ Apps Script ทันที
        document.getElementById("appFrame").src = BASE_SCRIPT_URL + currentParams;
    </script>
</body>
</html>
