<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผลการประเมินรายบริษัท</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: none; }
    </style>
</head>
<body>
    <iframe id="gasFrame" allow="clipboard-write; camera; microphone; forms;"></iframe>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw5jmVKMEUHMhp6GrYjluHQIie1S4L3x7ahdJJiwutA6LbqQ3aPGz_GvGEBHpvWOWuEdA/exec";
        // ดึง ?reportId=... ที่ส่งมากับ GitHub แล้วส่งต่อไปยัง GAS page=report
        const params = window.location.search;
        const joiner = params.startsWith("?") ? "&" : "?";
        document.getElementById("gasFrame").src = GAS_URL + "?page=report" + joiner + params.replace("?", "");
    </script>
</body>
</html>
