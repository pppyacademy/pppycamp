<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผลการประเมินรายบริษัท</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: none; }
    </style>
</head>
<body>
    <iframe id="gasFrame" allow="clipboard-write; camera; microphone; forms;"></iframe>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw5jmVKMEUHMhp6GrYjluHQIie1S4L3x7ahdJJiwutA6LbqQ3aPGz_GvGEBHpvWOWuEdA/exec";
        
        // ดึง reportId จาก URL ปัจจุบัน
        const urlParams = new URLSearchParams(window.location.search);
        let repId = urlParams.get("reportId") || urlParams.get("report") || "";
        
        // ล้างเครื่องหมายคำพูดส่วนเกินออก (ถ้ามี)
        repId = repId.replace(/['"\s]/g, '').trim();

        // ส่งต่อ parameter ไปยัง Google Apps Script
        document.getElementById("gasFrame").src = GAS_URL + "?page=report&reportId=" + encodeURIComponent(repId);
    </script>
</body>
</html>
